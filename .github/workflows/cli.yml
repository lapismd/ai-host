name: Verify standalone CLI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: pnpm install --frozen-lockfile
      - run: deno task check
      - run: pnpm spec:check
      - run: pnpm test
      - run: pnpm build
      - run: deno task build --target ${{ matrix.target }}
      - run: deno task test:cli
      - run: pnpm pack --pack-destination artifacts/npm
      - uses: actions/upload-artifact@v7
        with:
          name: lapis-ai-host-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
